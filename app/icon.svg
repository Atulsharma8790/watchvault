<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Yellow rounded square background -->
  <rect width="64" height="64" rx="14" fill="#E8C547"/>
  <!-- Clapperboard body -->
  <rect x="12" y="26" width="40" height="28" rx="3" fill="#0A0D14"/>
  <!-- Clapperboard top bar -->
  <rect x="12" y="18" width="40" height="10" rx="3" fill="#0A0D14"/>
  <!-- Diagonal stripes on top bar -->
  <clipPath id="bar"><rect x="12" y="18" width="40" height="10" rx="3"/></clipPath>
  <g clip-path="url(#bar)">
    <line x1="18" y1="18" x2="10" y2="28" stroke="#E8C547" stroke-width="4"/>
    <line x1="27" y1="18" x2="19" y2="28" stroke="#E8C547" stroke-width="4"/>
    <line x1="36" y1="18" x2="28" y2="28" stroke="#E8C547" stroke-width="4"/>
    <line x1="45" y1="18" x2="37" y2="28" stroke="#E8C547" stroke-width="4"/>
    <line x1="54" y1="18" x2="46" y2="28" stroke="#E8C547" stroke-width="4"/>
  </g>
  <!-- Hinge line between bar and body -->
  <line x1="12" y1="28" x2="52" y2="28" stroke="#E8C547" stroke-width="1.5" opacity="0.4"/>
  <!-- Play triangle on body -->
  <polygon points="25,34 25,46 41,40" fill="#E8C547"/>
</svg>
